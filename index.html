<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahana Kuttikulangara | Meteorologist</title>
<meta name="description" content="Ahana Kuttikulangara: meteorologist and research scientist at the University of Cologne working on turbulence in the stable Arctic boundary layer and stochastic parameterisation in ICON.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2430;
    --muted: #5b6676;
    --line: #e3e7ec;
    --bg: #fbfcfd;
    --accent: #1f5f7a;
    --accent-soft: #e8f1f5;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink);
    background: var(--bg);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Navigation */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(251,252,253,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  nav .inner {
    max-width: 920px; margin: 0 auto; padding: 0.8rem 1.5rem;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  }
  nav .brand { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; color: var(--ink); font-size: 1.05rem; }
  nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.2rem; flex-wrap: wrap; }
  nav ul a { color: var(--muted); font-size: 0.9rem; font-weight: 500; }
  nav ul a:hover { color: var(--accent); text-decoration: none; }

  main { max-width: 920px; margin: 0 auto; padding: 0 1.5rem 4rem; }

  /* Header */
  header.hero {
    display: grid; grid-template-columns: 180px 1fr; gap: 2.5rem; align-items: center;
    padding: 3.5rem 0 2.5rem;
  }
  .photo {
    width: 180px; height: 180px; border-radius: 50%;
    object-fit: cover; background: var(--accent-soft);
    border: 4px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .initials {
    width: 180px; height: 180px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Source Serif 4", Georgia, serif; font-size: 3.5rem;
  }
  h1 {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 600;
    font-size: 2.4rem; line-height: 1.15; margin: 0 0 0.3rem;
  }
  .role { font-size: 1.1rem; color: var(--accent); font-weight: 500; margin: 0; }
  .affil { color: var(--muted); margin: 0.2rem 0 1.2rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .links a {
    display: inline-block; padding: 0.35rem 0.9rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: #fff; color: var(--ink); font-size: 0.88rem; font-weight: 500;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .links a.primary:hover { background: #174b61; color: #fff; }

  /* Sections */
  section { padding: 2.2rem 0; border-top: 1px solid var(--line); }
  h2 {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 600;
    font-size: 1.55rem; margin: 0 0 1.2rem;
  }
  h3 { font-size: 1rem; font-weight: 600; margin: 0; }
  p { margin: 0 0 1rem; }

  .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
  .tags li {
    background: var(--accent-soft); color: var(--accent);
    padding: 0.25rem 0.8rem; border-radius: 6px; font-size: 0.88rem; font-weight: 500;
  }

  .callout {
    background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 1.1rem 1.3rem; margin-bottom: 1.4rem;
  }
  .callout .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

  /* Timeline entries */
  .entry { display: grid; grid-template-columns: 150px 1fr; gap: 1.5rem; margin-bottom: 1.4rem; }
  .entry:last-child { margin-bottom: 0; }
  .when { color: var(--muted); font-size: 0.9rem; padding-top: 0.05rem; }
  .where { color: var(--muted); font-size: 0.93rem; margin: 0.1rem 0 0.3rem; }
  .entry p { margin: 0.2rem 0 0; font-size: 0.95rem; }

  /* Publications */
  ol.pubs { margin: 0; padding-left: 1.3rem; }
  ol.pubs li { margin-bottom: 1.1rem; padding-left: 0.3rem; }
  ol.pubs .title { font-weight: 600; }
  ol.pubs .venue { font-style: italic; }
  ol.pubs .me { font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .doi { font-size: 0.88rem; }

  /* Talks */
  ul.talks { list-style: none; margin: 0; padding: 0; }
  ul.talks li { margin-bottom: 1rem; display: grid; grid-template-columns: 150px 1fr; gap: 1.5rem; }
  ul.talks .ev { font-weight: 600; font-size: 0.9rem; color: var(--accent); }
  ul.talks .t { display: block; }
  ul.talks .d { color: var(--muted); font-size: 0.9rem; }

  .award { display: inline-block; background: #fff6e0; color: #8a5a00; font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 4px; margin-left: 0.4rem; vertical-align: middle; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.3rem; }
  .card h3 { margin-bottom: 0.3rem; }
  .card p { font-size: 0.93rem; margin: 0; }

  dl.skills { display: grid; grid-template-columns: 150px 1fr; gap: 0.6rem 1.5rem; margin: 0; }
  dl.skills dt { font-weight: 600; font-size: 0.93rem; }
  dl.skills dd { margin: 0; font-size: 0.95rem; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem 1rem; border-top: 1px solid var(--line); }

  @media (max-width: 680px) {
    nav ul { display: none; }
    header.hero { grid-template-columns: 1fr; text-align: center; padding-top: 2.5rem; }
    .photo, .initials { margin: 0 auto; width: 140px; height: 140px; }
    .links { justify-content: center; }
    h1 { font-size: 2rem; }
    .entry, ul.talks li, dl.skills { grid-template-columns: 1fr; gap: 0.2rem; }
    .grid2 { grid-template-columns: 1fr; }
  }

  /* Night-sky background behind the header */
  body { position: relative; }
  .flow-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 430px;
    z-index: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
  }
  main { position: relative; z-index: 1; }
  nav { background: rgba(12,31,79,0.88); border-bottom-color: rgba(255,255,255,0.12); }
  nav .brand { color: #fff; }
  nav ul a { color: #d4def0; }
  nav ul a:hover { color: #f6d86b; }
  header.hero { border: none; }
  header.hero > div:last-child {
    background: radial-gradient(ellipse at 40% 50%, rgba(16,30,84,0.8) 40%, rgba(12,31,79,0) 78%);
    padding: 1rem 1.5rem; margin: -1rem -1.5rem;
  }
  header.hero h1 { color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.35); }
  header.hero .role { color: #f6d86b; }
  header.hero .affil, header.hero .affil a { color: #dbe6f7; }
  header.hero .affil a:hover { color: #fff; }
  header.hero .links a { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.4); color: #fff; }
  header.hero .links a:hover { border-color: #f6d86b; color: #f6d86b; }
  header.hero .links a.primary { background: #f6c945; border-color: #f6c945; color: #0c1f4f; }
  header.hero .links a.primary:hover { background: #ffd95e; color: #0c1f4f; }
  .photo { border-color: #f6d86b; }
  #about { border-top: none; padding-top: 5rem; }
  .tags + .callout { margin-top: 1.8rem; }
  @media (max-width: 680px) { .flow-bg { height: 600px; } #about { padding-top: 4.5rem; } }
